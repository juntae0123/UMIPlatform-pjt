# 손으로 쓰는 해석. FINDINGS.md 는 생성물이므로 여기에 쓴다.
# tools/findings.py 가 이 파일을 읽어 FINDINGS.md 뒤에 붙인다.
#
# 규칙: 항목마다 근거를 적는다. 근거 없는 항목은 가설이지 발견이 아니다.
# 기각은 "되살릴 조건"이 있어야 기각이다. 조건이 없으면 그냥 안 해본 것이다.

facts:
  - name: "v2 이후 성공률이 올랐다는 증거가 없다"
    what: "v5 9.3% 는 v2 5.7%·v3 4.3% 와 95% 구간이 모두 겹친다. 이 n 으로는 셋이 구분되지 않는다"
    evidence: "v2 CI 3.6~8.9 · v3 CI 2.5~7.3 · v5 CI 6.5~13.2, 각 n=300 🟢"
    next: "데이터 수집 조건을 더 만지는 것은 이 구간 안에서 움직이는 일이다. 폐루프 실패를 직접 쳐야 한다"
  - name: "val_loss 는 무관한 정도가 아니라 역방향이다"
    what: "설정을 가로질러 비교하면 val_loss 가 낮은 쪽이 롤아웃이 더 나쁘다"
    evidence: "v2 val 0.0400/0.0449/0.0468 → 5.7% · v5 val 0.0531/0.0620/0.0756 → 9.3% 🟢"
    next: "체크포인트 선택을 best-val 로 하는 것 자체를 의심해야 한다. 별도 계측 필요 🟡"
  - name: "scripted 의 16% 실패는 파지 실패가 아니라 들어올림 실패다"
    what: "닫는 순간 4.2mm·턱접촉 8개·물체밀림 3.7mm — 접근도 파지도 성공했는데 안 들린다"
    evidence: "probe_recovery n=4 예비 🟢. rollout.py 주석의 기존 판정(4.7mm 는 CLOSE_OK_MM 5.0 안)과 일치. 이슈 64 의 '들어올림 IK 100개 중 25개 탈락'과도 같은 방향"
    next: "천장을 84%→90%대로 올릴 여지가 여기 있다. n=300 재확인 후 이슈 등록"
  - name: "위치 제어에서 중간 명령 교란은 저절로 지워진다"
    what: "5틱 명령 오프셋(±0.05rad)에 개루프 scripted 조차 점수가 변하지 않는다"
    evidence: "probe_recovery: scripted none 3/4 = t40±0.05 3/4 🟢 (n=4 예비)"
    next: "분포 밖 상태를 만들려면 **초기 관절 배치**를 흩어야 한다. G0-b 판정 조건을 그것으로 바꿨다"
  - name: "같은 설정 안에서도 학습 실행 간 편차가 크다"
    what: "v5 세 시드가 14% / 12% / 2%. 폭 12%p"
    evidence: "L40. 단일 학습의 단일 롤아웃으로 체크포인트를 비교할 수 없다 🟢"
    next: "학습 3회 반복 + 평균·범위 보고가 기본. 예외 없음"

rejected:
  - name: "R-AI-14 이미지 잡음 증강 (σ=2.0 계조)"
    what: "학습 이미지에 잡음을 넣어 폐루프 이미지 차이(0.28→8.53 계조)를 견디게 한다는 가설"
    evidence: "v6 seed0 12% · seed1 5%. seed2 를 0~33% 전 구간 대입해도 v5 CI 6.5~13.2% 와 겹친다. 갈라지려면 34%↑, 관측 최대는 14% 🟢"
    revive: "DAgger 이후 실물 전이에서 조명·노출이 원인으로 지목될 때. 그때는 sim2real 대책이지 누적오차 대책이 아니다"
  - name: "R-AI-12 dwell (파지 후 정지 구간)"
    what: "파지 직후 dwell_s 0.5초를 넣으면 파지가 안정된다는 가설"
    evidence: "v4 dwell 0.5s 0/300 (CI 0~1.3%) vs v5 dwell 0 28/300 (CI 6.5~13.2%). 구간 안 겹침 🟢"
    revive: "행동 표현이 관절 절대각에서 델타/청크로 바뀌면 다시 볼 것"
  - name: "R-AI-13 시연 타이밍 변주"
    what: "시연 속도를 섞으면 일반화가 는다는 가설"
    evidence: "프로젝트 원칙 '환경은 다양하게, 시연 방식은 동일하게'. 미측정 상태로 기각 🟡"
    revive: "동일 시연으로 20% 게이트를 넘긴 뒤에만"
  - name: "가설 A — 도달 범위 부족"
    what: "물체가 팔이 못 닿는 곳에 있어서 실패한다"
    evidence: "Center 0~15mm 구간 정밀도 최고(5.8mm)인데 성공률 0%. 가장 쉬운 곳에서도 실패 🟢"
    revive: "물체 배치 범위를 바꾸면 재측정"
  - name: "가설 D — 데이터 밀도 부족"
    what: "특정 위치의 시연이 적어서 그 위치를 못 배운다"
    evidence: "위와 같은 측정. 시연이 가장 조밀한 중심부 성공률 0% 🟢"
    revive: "동일"
  - name: "가설 — 정책이 이미지를 안 본다"
    what: "이미지를 무시하고 state 만 회귀해서 실패한다"
    evidence: "image_sensitivity 델타비율 0.740 >= 0.30 통과 🟢"
    revive: "인코더를 바꾸면 재측정"
  - name: "가설 — 정책이 붕괴(mode collapse)했다"
    what: "출력이 평균으로 뭉개져 아무 동작도 안 만든다"
    evidence: "diagnose_bc: bc L1 0.001620 vs identity 0.007543, std 비율 0.970~1.001 🟢"
    revive: "손실 함수를 바꾸면 재측정"
  - name: "가설 — lift 구간 신호가 약하다"
    what: "들어올림 구간의 학습 신호가 다른 구간보다 약해서 못 배운다"
    evidence: "구간별 델타 비교에서 lift 신호가 다른 구간과 비슷 🟢"
    revive: "행동 표현 변경 시"

alive:
  - name: "누적 오차(compounding error) — 현재 최우선 설명"
    what: "A(재생) 통과 · B(교사강요) 통과 · C(폐루프) 실패 = 공변량 이동의 교과서적 서명"
    evidence: "trace_execution: C 에서 state 차이가 t=1 부터 약 10틱마다 2배. 이미지 차이 0.28→8.53 계조 🟢"
    next: "DAgger — 시뮬에 84% scripted 전문가가 있으므로 라벨 비용이 0에 가깝다"
  - name: "이미지 민감도는 취약점이 아니라 교정 채널이다 🟡"
    what: "작은 이미지 변화를 무시하는 정책은 벗어난 상태를 되돌릴 수 없다"
    evidence: "v6 잡음증강: B 비율 0.175→0.1313 로 개선됐는데 C 는 성공→실패로 뒤집힘. seed0 12/100 vs v5 14/100 🟢"
    next: "v6 seed1·seed2 완료 후 판정. 확정되면 L39 를 '취약점'에서 '채널'로 정정하고 증강을 R-AI-14 로 기각"
  - name: "action chunking / ACT"
    what: "한 스텝씩 회귀하면 스텝마다 오차가 쌓인다. 묶어서 내면 누적 지점이 줄어든다"
    evidence: "미측정 🟡"
    next: "DAgger 다음. baseline 없이 넘어가지 않는다는 원칙에 따라 BC 가 게이트를 넘거나 원인이 확정된 뒤"
  - name: "행동 표현 — 절대 관절각의 정밀도 은폐"
    what: "손실 대부분이 '팔이 지금 어디 있나'로 채워지고 잔차(action-state)는 틀린 채 남는다"
    evidence: "identity 대비 L1 은 낮으나(0.00162 vs 0.00754) 폐루프는 실패 🟢"
    next: "joint_delta_gripper_abs 표현으로 동일 조건 비교"

instruments:
  - name: "closing_moment (eval/rollout.py)"
    what: "고쳤다. 히스테리시스 5틱 + 진폭 하위 25% 기준"
    evidence: "이전 판정은 그리퍼 명령이 2단계라는 전제였는데 학습 정책은 연속 회귀다. 판정 60틱 vs 실제 102틱 🟢"
    revive: "판정 문구도 단정을 뺐다. 이 값으로 원인을 정하지 않는다"
  - name: "렌더 결정론"
    what: "L37 해소. offsamples 0 (MSAA off) 으로 비트 단위 동일"
    evidence: "check_determinism 통과 🟢"
  - name: "scripted 상한선"
    what: "5회 연속 84.0%. 계측기가 표류하지 않는다"
    evidence: "동시에 시연자 통일이 궤적을 바꾸지 않았다는 증거이기도 하다 🟢"
  - name: "조건 표류 검출 (run_conditions)"
    what: "조건 dict 를 만드는 곳을 한 군데로 모았다"
    evidence: "첫 실행에서 image_noise_gray·tag 가 바뀌었는데 '동일하다'고 보고했다. 조건을 두 군데서 따로 만든 탓 🟢"
  - name: "ScriptedFeedbackPolicy (policy/baselines.py)"
    what: "DAgger 용 상태 피드백 전문가. 제작 중 자기 버그 두 개를 계측기가 잡았다"
    evidence: "(1) lift 목표를 물체 **현재** 위치에서 계산해 들고 있는 물체를 영원히 쫓았다 — lift IK 22/22 실패, 0/4 성공. 파지 시점에 기준을 고정해 해소. (2) 턱접촉·물체밀림을 닫는 **명령이 나간 틱**에 재서 전부 0 이었다 — 닫기 완료 후로 시점 정정 🟢"
    revive: "G0-a/G0-b 는 n=300 서버 실행 대기. 통과 전에는 라벨을 모으지 않는다"
  - name: "n 의 한계"
    what: "n=20, p≈0.8 의 구간 반폭(±18%p)이 게이트 폭(20%p)과 같다"
    evidence: "게이트를 옮기지 말고 n 을 올린다. 게이트 변경은 사후 합리화다"
